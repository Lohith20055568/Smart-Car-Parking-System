services:
  mongo:
    image: mongo:7
    container_name: smart-parking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    container_name: smart-parking-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DATABASE_NAME=smart_parking
      - CORS_ORIGINS=*
      - USE_YOLO=false
    depends_on:
      - mongo
  frontend:
    image: node:22-alpine
    container_name: smart-parking-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
volumes:
  mongo_data:
